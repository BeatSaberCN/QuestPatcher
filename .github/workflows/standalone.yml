name: Standalone

on:
  release:
    types:
    - published
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'installer/**'
      - '.github/workflows/macos-dmg.yml'
      - '.github/workflows/windows-installer.yml'
      - '.github/workflows/verify-download-hashes.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target:
          - runtime: linux-x64
            os: ubuntu-latest
            artifact: QuestPatcher-linux.zip
          # Windows exe icon and version info can only be embedded when building on Windows
          - runtime: win-x64
            os: windows-latest
            artifact: QuestPatcher-windows-standalone.zip

    runs-on: ${{ matrix.target.os }}
    name: Build for ${{ matrix.target.runtime }}
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Set version
      if: ${{ github.event_name == 'release' }}
      run: '"${{ github.event.release.tag_name }}" | Out-File -NoNewline -FilePath ./VERSION'
    - name: Build ${{ matrix.target.runtime }}
      run: dotnet publish QuestPatcher/QuestPatcher.csproj -r ${{ matrix.target.runtime }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -c Release --self-contained
    - name: Copy license
      run: cp LICENSE QuestPatcher/bin/Release/net10.0/${{ matrix.target.runtime }}/publish/LICENSE.txt
    - name: Artifact Upload ${{ matrix.target.runtime }}
      if: ${{ github.event_name != 'release' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target.runtime }}
        path: QuestPatcher/bin/Release/net10.0/${{ matrix.target.runtime }}/publish/
    - name: Compress Release Artifact
      if: ${{ github.event_name == 'release' && runner.os == 'Windows' }}
      run: 'Compress-Archive QuestPatcher/bin/Release/net10.0/${{ matrix.target.runtime }}/publish/* ./release.zip'
    - name: Compress Release Artifact
      # zip keeps the executable bit, Compress-Archive does not
      if: ${{ github.event_name == 'release' && runner.os != 'Windows' }}
      shell: bash
      working-directory: QuestPatcher/bin/Release/net10.0/${{ matrix.target.runtime }}/publish
      run: zip -r "$GITHUB_WORKSPACE/release.zip" .
    - name: Upload Release Asset
      if: ${{ github.event_name == 'release' }}
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release.zip
        asset_name: ${{ matrix.target.artifact }}
        asset_content_type: application/zip
